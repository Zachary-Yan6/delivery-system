spring:
  application:
    name: delivery-system

  datasource:
    url: jdbc:postgresql://localhost:5433/delivery_db
    username: zachary
    password: zachary
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.zachary.delivery_system.event.location.DriverLocationReportedEvent
        spring.json.trusted.packages: com.zachary.delivery_system.event.location
        spring.json.use.type.headers: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.zachary.delivery_system.typehandler
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120

  kafka:
    topics:
      driver-location-reported: driver.location.reported.v1
    groups:
      tracking-projection: tracking-projection-v1
      history-projection: history-projection-v1
  eta:
    fixed-speed-kph: 30

  assignment:
    max-active-deliveries: 10
    max-location-age-seconds: 300

  outbox:
    driver-location:
      fixed-delay-ms: 1000
      batch-size: 20
routing:
  osrm:
    base-url: http://router.project-osrm.org
